name: Render Phone Ban 2026

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-phone-ban-2026.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-video/package-lock.json

      - name: Install dependencies
        working-directory: remotion-video
        run: npm ci

      - name: Ensure Remotion browser
        working-directory: remotion-video
        run: npx remotion browser ensure

      - name: Verify composition
        working-directory: remotion-video
        run: npx remotion compositions

      - name: Render MP4
        working-directory: remotion-video
        run: |
          mkdir -p out
          npx remotion render PhoneBan2026 out/HORS_CADRE_TELEPHONE_LYCEE_V1_REMOTION.mp4 \
            --codec=h264 \
            --crf=18 \
            --concurrency=2 \
            --overwrite

      - name: Verify output
        working-directory: remotion-video
        run: |
          test -f out/HORS_CADRE_TELEPHONE_LYCEE_V1_REMOTION.mp4
          ls -lh out/HORS_CADRE_TELEPHONE_LYCEE_V1_REMOTION.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HORS_CADRE_TELEPHONE_LYCEE_V1_REMOTION
          path: remotion-video/out/HORS_CADRE_TELEPHONE_LYCEE_V1_REMOTION.mp4
          if-no-files-found: error
          retention-days: 7
