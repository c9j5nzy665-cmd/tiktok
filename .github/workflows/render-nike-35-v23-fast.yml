name: Render Nike 35 Dollar Reel V2.3 Fast

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-nike-35-v23-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion-video/package-lock.json
      - name: Install dependencies
        working-directory: remotion-video
        run: npm ci
      - name: Ensure Remotion browser
        working-directory: remotion-video
        run: npx remotion browser ensure
      - name: Render Nike V2.3
        working-directory: remotion-video
        run: |
          mkdir -p out
          npx remotion render Nike35V23 out/HORS_CADRE_NIKE_35_V2_3_SILENT.mp4 --codec=h264 --crf=20 --concurrency=2 --overwrite
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HORS_CADRE_NIKE_35_V2_3_SILENT
          path: remotion-video/out/HORS_CADRE_NIKE_35_V2_3_SILENT.mp4
          if-no-files-found: error
          retention-days: 7
