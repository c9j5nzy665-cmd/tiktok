name: Render IKEA V4 Premium

on:
  workflow_dispatch:
  push:
    branches:
      - hors-cadre-ikea-v3
    paths:
      - 'HORS_CADRE_IKEA_V4/**'
      - '.github/workflows/render-ikea-v3.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter

      - name: Render V4 Premium
        run: |
          chmod +x HORS_CADRE_IKEA_V4/render.sh
          bash HORS_CADRE_IKEA_V4/render.sh

      - name: Verify output
        run: |
          test -s HORS_CADRE_IKEA_V4/HORS_CADRE_EFFET_IKEA_MASTER_V4_PREMIUM.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 HORS_CADRE_IKEA_V4/HORS_CADRE_EFFET_IKEA_MASTER_V4_PREMIUM.mp4

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: HORS_CADRE_EFFET_IKEA_MASTER_V4_PREMIUM
          path: HORS_CADRE_IKEA_V4/HORS_CADRE_EFFET_IKEA_MASTER_V4_PREMIUM.mp4
          if-no-files-found: error
          retention-days: 7
