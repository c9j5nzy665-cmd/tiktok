name: Render IKEA V3 Reel

on:
  workflow_dispatch:
  push:
    branches:
      - hors-cadre-ikea-v3
    paths:
      - 'HORS_CADRE_IKEA_V3/**'
      - 'render.sh'
      - '.github/workflows/render-ikea-v3.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render Reel
        run: bash ./render.sh

      - name: Verify output
        run: |
          test -s HORS_CADRE_IKEA_V3/HORS_CADRE_EFFET_IKEA_MASTER_V3_REEL_IMAGES_REELLES.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 HORS_CADRE_IKEA_V3/HORS_CADRE_EFFET_IKEA_MASTER_V3_REEL_IMAGES_REELLES.mp4

      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: HORS_CADRE_EFFET_IKEA_MASTER_V3_REEL_IMAGES_REELLES
          path: HORS_CADRE_IKEA_V3/HORS_CADRE_EFFET_IKEA_MASTER_V3_REEL_IMAGES_REELLES.mp4
          if-no-files-found: error
          retention-days: 7
