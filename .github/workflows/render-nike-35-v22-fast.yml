name: Render Nike 35 Dollar Reel V2.2 Fast

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-nike-35-v22-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: remotion-video
        run: npm ci --no-audit --no-fund --progress=false

      - name: Ensure Remotion browser
        working-directory: remotion-video
        run: npx remotion browser ensure

      - name: Render Nike V2.2
        working-directory: remotion-video
        run: |
          mkdir -p out
          npx remotion render Nike35V22 out/HORS_CADRE_NIKE_35_V2_2_SILENT.mp4 \
            --codec=h264 \
            --crf=18 \
            --concurrency=2 \
            --overwrite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HORS_CADRE_NIKE_35_V2_2_FAST
          path: remotion-video/out/HORS_CADRE_NIKE_35_V2_2_SILENT.mp4
          if-no-files-found: error
          retention-days: 7
